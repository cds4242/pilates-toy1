<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>마이페이지 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary: #E8A4A4;
  --color-primary-dark: #D48A8A;
  --color-primary-light: #F5E6D3;
  --color-accent: #D4B896;
  --color-bg: #FFFBF7;
  --color-bg-card: #FFFFFF;
  --color-text-title: #3A3A3A;
  --color-text-body: #6B6B6B;
  --color-text-sub: #A0A0A0;
  --color-border: #EDE4DA;
  --color-success: #7CB68E;
  --color-error: #D4686A;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-full: 24px;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
}

.mobile-frame {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--color-bg);
  padding-bottom: 80px;
}

.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--color-bg);
  padding: 16px var(--spacing-lg);
  border-bottom: 1px solid var(--color-border);
}

.header-title {
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 700;
  color: var(--color-text-title);
}

.content {
  padding: var(--spacing-lg);
  display: flex; flex-direction: column;
  gap: var(--spacing-lg);
}

/* ── 프로필 ── */
.profile-card {
  text-align: center;
  padding: 28px 20px;
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 20px rgba(212, 184, 150, 0.1);
}

.profile-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700;
  color: #FFFFFF;
  margin: 0 auto var(--spacing-sm);
}

.profile-name {
  font-family: 'Playfair Display', serif;
  font-size: 20px; font-weight: 700;
  color: var(--color-text-title);
  margin-bottom: 4px;
}

.profile-joined { font-size: 13px; color: var(--color-text-sub); }

.profile-attendance {
  font-size: 13px; color: var(--color-success);
  font-weight: 600; margin-top: 4px;
}

/* ── 정기권 ── */
.section-title {
  font-size: 16px; font-weight: 700;
  color: var(--color-text-title);
  margin-bottom: var(--spacing-sm);
}

.pass-card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: 0 2px 10px rgba(212, 184, 150, 0.08);
}

.pass-label {
  font-size: 11px; font-weight: 600;
  color: var(--color-accent);
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: var(--spacing-xs);
}

.pass-name {
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 700;
  color: var(--color-text-title);
  margin-bottom: var(--spacing-sm);
}

.pass-count {
  display: flex; align-items: baseline; gap: 4px;
  margin-bottom: var(--spacing-sm);
}

.pass-count-current { font-size: 28px; font-weight: 700; color: var(--color-primary-dark); }
.pass-count-total { font-size: 14px; color: var(--color-text-body); }

.progress-bar {
  height: 6px; background: var(--color-primary-light);
  border-radius: 3px; overflow: hidden;
  margin-bottom: var(--spacing-sm);
}

.progress-fill { height: 100%; background: var(--color-primary); border-radius: 3px; }

.pass-meta { font-size: 13px; color: var(--color-text-sub); }
.pass-meta span { font-weight: 600; color: var(--color-text-title); }

.pass-expiry { font-size: 13px; color: var(--color-text-sub); margin-top: 4px; }

/* ── 출석 이력 ── */
.attendance-list {
  display: flex; flex-direction: column; gap: var(--spacing-xs);
}

.attendance-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px;
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
}

.attendance-info { flex: 1; }
.attendance-date { font-size: 14px; font-weight: 600; color: var(--color-text-title); margin-bottom: 2px; }
.attendance-class { font-size: 13px; color: var(--color-text-body); }

.badge { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
.badge-present { background: #EDF7EF; color: var(--color-success); }
.badge-absent { background: #FDECEA; color: var(--color-error); }

/* ── 메뉴 ── */
.menu-list { display: flex; flex-direction: column; }

.menu-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--color-border);
  text-decoration: none;
  color: var(--color-text-title);
  font-size: 15px; cursor: pointer;
  transition: color 0.2s;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover { color: var(--color-primary-dark); }
.menu-item.muted { color: var(--color-text-body); }
.menu-item.danger { color: var(--color-error); }
.menu-item svg { width: 18px; height: 18px; color: var(--color-text-sub); }

/* ── 탭바 ── */
.tab-bar {
  position: fixed; bottom: 0;
  left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--color-bg);
  border-top: 1px solid var(--color-border);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 10px 0;
  text-decoration: none; font-size: 11px;
  color: var(--color-text-sub); transition: color 0.2s;
}
.tab-item.active { color: var(--color-primary-dark); }
.tab-item svg { width: 22px; height: 22px; }
</style>
</head>
