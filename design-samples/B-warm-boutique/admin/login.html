<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>관리자 로그인 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary: #E8A4A4;
  --color-primary-dark: #D48A8A;
  --color-primary-light: #F5E6D3;
  --color-accent: #D4B896;
  --color-bg: #FFFBF7;
  --color-bg-card: #FFFFFF;
  --color-text-title: #3A3A3A;
  --color-text-body: #6B6B6B;
  --color-text-sub: #A0A0A0;
  --color-border: #EDE4DA;
  --color-input-border: #DDD5CB;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-full: 24px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-container {
  display: flex;
  max-width: 900px;
  width: 100%;
  min-height: 520px;
  background: var(--color-bg-card);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(139, 115, 85, 0.08);
}

.login-hero {
  flex: 1;
  background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-accent) 100%);
  padding: 60px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  color: var(--color-text-title);
}

.login-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: var(--spacing-md);
  line-height: 1.4;
}

.login-hero p {
  font-size: 15px;
  color: var(--color-text-body);
  line-height: 1.7;
}

.hero-deco {
  width: 48px;
  height: 2px;
  background: var(--color-primary-dark);
  margin-bottom: var(--spacing-lg);
}

.login-form-side {
  flex: 1;
  padding: 60px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.form-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  color: var(--color-text-sub);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 6px 14px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  margin-bottom: var(--spacing-lg);
  width: fit-content;
}

.form-title {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--color-text-title);
  margin-bottom: var(--spacing-xl);
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md);
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.input-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-sub);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.input-group input {
  border: 1px solid var(--color-input-border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-size: 15px;
  font-family: 'Pretendard', sans-serif;
  color: var(--color-text-title);
  background: var(--color-bg);
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  width: 100%;
}

.input-group input::placeholder {
  color: var(--color-text-sub);
}

.input-group input:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(232, 164, 164, 0.15);
}

.btn-admin {
  background: transparent;
  color: var(--color-text-title);
  border: 2px solid var(--color-text-title);
  border-radius: var(--radius-full);
  padding: 16px;
  font-size: 15px;
  font-weight: 600;
  font-family: 'Pretendard', sans-serif;
  cursor: pointer;
  transition: all 0.3s;
  width: 100%;
  margin-top: var(--spacing-md);
  letter-spacing: 1px;
}

.btn-admin:hover {
  background: var(--color-text-title);
  color: #FFFFFF;
}

@media (max-width: 768px) {
  .login-container {
    flex-direction: column;
    max-width: 480px;
    margin: var(--spacing-lg);
  }
  .login-hero {
    padding: 40px var(--spacing-lg);
    min-height: auto;
  }
  .login-hero h1 { font-size: 22px; }
  .login-form-side { padding: var(--spacing-lg); }
}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-hero">
    <div class="hero-deco"></div>
    <h1>필라테스 OO점<br>관리 시스템</h1>
    <p>회원, 강사, 시간표, 매출을<br>한곳에서 효율적으로 관리하세요.</p>
  </div>
  <div class="login-form-side">
    <span class="form-badge">관리자 전용</span>
    <h2 class="form-title">Login</h2>
    <form class="login-form" onsubmit="event.preventDefault();location.href='dashboard.html';">
      <div class="input-group"><label for="email">이메일</label><input type="email" id="email" placeholder="admin@pilates.com" autocomplete="email"></div>
      <div class="input-group"><label for="password">비밀번호</label><input type="password" id="password" placeholder="비밀번호" autocomplete="current-password"></div>
      <div class="input-group"><label for="otp">2FA 인증 코드</label><input type="text" id="otp" placeholder="6자리 코드 입력" maxlength="6" inputmode="numeric"></div>
      <button type="submit" class="btn-admin">로그인</button>
    </form>
  </div>
</div>
</body>
</html>
