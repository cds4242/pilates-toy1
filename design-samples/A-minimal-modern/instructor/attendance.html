<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>출석 체크 - 강사</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--color-primary:#F8C8DC;--color-primary-dark:#F0A8C4;--color-bg:#FFFFFF;--color-bg-section:#F8F8F8;--color-text-title:#2D2D2D;--color-text-body:#6B6B6B;--color-text-sub:#9B9B9B;--color-border:#EEEEEE;--color-instructor-accent:#7C8FD4;--color-success:#4CAF50;--color-warning:#F4A261;--color-error:#E76F51;--radius-sm:8px;--radius-md:12px;--spacing-xs:8px;--spacing-sm:12px;--spacing-md:16px;--spacing-lg:24px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--color-bg-section);color:var(--color-text-body);-webkit-font-smoothing:antialiased}
.mobile-frame{max-width:480px;margin:0 auto;min-height:100vh;background:var(--color-bg)}
.header{position:sticky;top:0;z-index:100;background:var(--color-bg);padding:16px var(--spacing-lg);display:flex;align-items:center;gap:var(--spacing-md);border-bottom:1px solid var(--color-border)}
.header-back{cursor:pointer;color:var(--color-text-title);display:flex;align-items:center;background:none;border:none;padding:0}
.header-back svg{width:24px;height:24px}
.header-title{font-size:18px;font-weight:700;color:var(--color-text-title)}
.class-info-bar{background:var(--color-bg-section);padding:var(--spacing-md) var(--spacing-lg);border-bottom:1px solid var(--color-border)}
.class-info-bar .info-row{display:flex;gap:var(--spacing-md);font-size:13px;color:var(--color-text-body)}
.class-info-bar .info-row span{font-weight:600}
.member-list{padding:var(--spacing-lg);display:flex;flex-direction:column;gap:var(--spacing-sm)}
.member-item{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:16px;display:flex;align-items:center;gap:var(--spacing-md)}
.member-info{flex:1}
.member-name{font-size:15px;font-weight:600;color:var(--color-text-title)}
.member-phone{font-size:13px;color:var(--color-text-sub);margin-top:2px}
.member-memo{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--color-instructor-accent);margin-top:4px;font-weight:600}
.member-memo svg{width:14px;height:14px}
.attendance-btns{display:flex;gap:4px;flex-shrink:0}
.att-btn{border:none;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:600;font-family:'Pretendard',sans-serif;cursor:pointer;transition:all .2s;color:var(--color-text-sub);background:var(--color-bg-section)}
.att-btn.selected-present{background:#E8F5E9;color:var(--color-success)}
.att-btn.selected-late{background:#FFF3E0;color:var(--color-warning)}
.att-btn.selected-absent{background:#FDECEA;color:var(--color-error)}
.bottom-bar{position:sticky;bottom:0;background:var(--color-bg);padding:var(--spacing-md) var(--spacing-lg);border-top:1px solid var(--color-border)}
.btn-complete{background:var(--color-instructor-accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:16px;font-size:16px;font-weight:600;font-family:'Pretendard',sans-serif;cursor:pointer;width:100%;transition:background .2s}
.btn-complete:hover{background:#6A7DC2}
</style>
</head>
<body>
<div class="mobile-frame">
  <header class="header">
    <button class="header-back" onclick="history.back()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg></button>
    <h1 class="header-title">출석 체크</h1>
  </header>

  <div class="class-info-bar">
    <div class="info-row"><span>2026.05.09 (토)</span><span>09:00 - 09:50</span><span>그룹 필라테스</span></div>
  </div>

  <div class="member-list">
    <div class="member-item">
      <div class="member-info"><div class="member-name">김민지</div><div class="member-phone">010-****-5678</div></div>
      <div class="attendance-btns">
        <button class="att-btn selected-present" onclick="selectAtt(this,'present')">출석</button>
        <button class="att-btn" onclick="selectAtt(this,'late')">지각</button>
        <button class="att-btn" onclick="selectAtt(this,'absent')">결석</button>
      </div>
    </div>
    <div class="member-item">
      <div class="member-info"><div class="member-name">이서연</div><div class="member-phone">010-****-1234</div><div class="member-memo"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.076-4.076a1.526 1.526 0 0 1 1.037-.443 48.282 48.282 0 0 0 5.68-.494c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z"/></svg>허리 주의</div></div>
      <div class="attendance-btns">
        <button class="att-btn selected-present" onclick="selectAtt(this,'present')">출석</button>
        <button class="att-btn" onclick="selectAtt(this,'late')">지각</button>
        <button class="att-btn" onclick="selectAtt(this,'absent')">결석</button>
      </div>
    </div>
    <div class="member-item">
      <div class="member-info"><div class="member-name">박소윤</div><div class="member-phone">010-****-9876</div></div>
      <div class="attendance-btns">
        <button class="att-btn" onclick="selectAtt(this,'present')">출석</button>
        <button class="att-btn selected-late" onclick="selectAtt(this,'late')">지각</button>
        <button class="att-btn" onclick="selectAtt(this,'absent')">결석</button>
      </div>
    </div>
    <div class="member-item">
      <div class="member-info"><div class="member-name">최유진</div><div class="member-phone">010-****-4567</div></div>
      <div class="attendance-btns">
        <button class="att-btn" onclick="selectAtt(this,'present')">출석</button>
        <button class="att-btn" onclick="selectAtt(this,'late')">지각</button>
        <button class="att-btn selected-absent" onclick="selectAtt(this,'absent')">결석</button>
      </div>
    </div>
    <div class="member-item">
      <div class="member-info"><div class="member-name">정하윤</div><div class="member-phone">010-****-3210</div></div>
      <div class="attendance-btns">
        <button class="att-btn selected-present" onclick="selectAtt(this,'present')">출석</button>
        <button class="att-btn" onclick="selectAtt(this,'late')">지각</button>
        <button class="att-btn" onclick="selectAtt(this,'absent')">결석</button>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn-complete" onclick="alert('출석 체크가 저장되었습니다.')">출석 체크 완료</button>
  </div>
</div>
<script>
function selectAtt(btn,type){
  var btns=btn.parentElement.querySelectorAll('.att-btn');
  btns.forEach(function(b){b.className='att-btn'});
  btn.classList.add('selected-'+type);
}
</script>
</body>
</html>
