<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>로그인 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --color-primary: #F8C8DC;
  --color-primary-dark: #F0A8C4;
  --color-primary-light: #FCE4EC;
  --color-bg: #FFFFFF;
  --color-bg-section: #F8F8F8;
  --color-text-title: #2D2D2D;
  --color-text-body: #6B6B6B;
  --color-text-sub: #9B9B9B;
  --color-border: #EEEEEE;
  --color-input-border: #DDDDDD;
  --color-success: #4CAF50;
  --color-warning: #F4A261;
  --color-error: #E76F51;
  --radius-sm: 8px;
  --radius-md: 12px;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-xxl: 48px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg-section);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
}

.mobile-frame {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--color-bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--spacing-lg);
}

.login-header {
  text-align: center;
  margin-bottom: var(--spacing-xxl);
  padding-top: var(--spacing-xxl);
}

.logo-text {
  font-size: 24px;
  font-weight: 700;
  color: var(--color-text-title);
  margin-bottom: var(--spacing-xs);
}

.logo-sub {
  font-size: 14px;
  color: var(--color-text-body);
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md);
  margin-bottom: var(--spacing-lg);
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.input-group label {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-title);
}

.input-group input {
  border: 1px solid var(--color-input-border);
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 15px;
  font-family: 'Pretendard', sans-serif;
  color: var(--color-text-title);
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}

.input-group input::placeholder {
  color: var(--color-text-sub);
}

.input-group input:focus {
  border-color: var(--color-primary);
}

.btn-primary {
  background: var(--color-primary);
  color: var(--color-text-title);
  border: none;
  border-radius: var(--radius-sm);
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  font-family: 'Pretendard', sans-serif;
  cursor: pointer;
  transition: background-color 0.2s;
  width: 100%;
}

.btn-primary:hover {
  background: var(--color-primary-dark);
}

.btn-primary:active {
  background: var(--color-primary-dark);
  transform: scale(0.99);
}

.login-links {
  display: flex;
  justify-content: center;
  gap: var(--spacing-lg);
  margin-top: var(--spacing-lg);
}

.login-links a {
  font-size: 14px;
  text-decoration: none;
  font-weight: 400;
}

.link-signup {
  color: var(--color-primary-dark);
}

.link-forgot {
  color: var(--color-text-body);
}

.login-links a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>
<div class="mobile-frame">
  <div class="login-header">
    <div class="logo-text">필라테스 OO점</div>
    <div class="logo-sub">회원 로그인</div>
  </div>

  <form class="login-form" onsubmit="event.preventDefault(); location.href='home.html';">
    <div class="input-group">
      <label for="phone">휴대폰 번호</label>
      <input type="tel" id="phone" placeholder="010-0000-0000" autocomplete="tel">
    </div>
    <div class="input-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-primary">로그인</button>
  </form>

  <div class="login-links">
    <a href="#" class="link-signup">회원가입</a>
    <a href="#" class="link-forgot">비밀번호 찾기</a>
  </div>
</div>
</body>
</html>
