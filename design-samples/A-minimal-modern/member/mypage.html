<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>마이페이지 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --color-primary: #F8C8DC;
  --color-primary-dark: #F0A8C4;
  --color-primary-light: #FCE4EC;
  --color-bg: #FFFFFF;
  --color-bg-section: #F8F8F8;
  --color-text-title: #2D2D2D;
  --color-text-body: #6B6B6B;
  --color-text-sub: #9B9B9B;
  --color-border: #EEEEEE;
  --color-success: #4CAF50;
  --color-warning: #F4A261;
  --color-error: #E76F51;
  --radius-sm: 8px;
  --radius-md: 12px;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg-section);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
}

.mobile-frame {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--color-bg);
  padding-bottom: 80px;
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--color-bg);
  padding: 16px var(--spacing-lg);
  border-bottom: 1px solid var(--color-border);
}

.header-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text-title);
}

/* ── Content ── */
.content {
  padding: var(--spacing-lg);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-lg);
}

/* ── 프로필 카드 ── */
.profile-card {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: 20px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
}

.profile-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--color-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text-title);
  flex-shrink: 0;
}

.profile-info {
  flex: 1;
}

.profile-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text-title);
  margin-bottom: 2px;
}

.profile-joined {
  font-size: 13px;
  color: var(--color-text-sub);
}

.profile-attendance {
  font-size: 13px;
  color: var(--color-success);
  font-weight: 600;
  margin-top: 2px;
}

/* ── 정기권 섹션 ── */
.section-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--color-text-title);
  margin-bottom: var(--spacing-sm);
}

.pass-card {
  background: var(--color-primary-light);
  border-radius: var(--radius-md);
  padding: 20px;
}

.pass-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-sm);
}

.pass-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-title);
}

.pass-expiry {
  font-size: 12px;
  color: var(--color-text-body);
}

.pass-count {
  display: flex;
  align-items: baseline;
  gap: 4px;
  margin-bottom: var(--spacing-sm);
}

.pass-count-current {
  font-size: 28px;
  font-weight: 700;
  color: var(--color-text-title);
}

.pass-count-total {
  font-size: 14px;
  color: var(--color-text-body);
}

.progress-bar {
  height: 8px;
  background: rgba(255,255,255,0.6);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: var(--spacing-sm);
}

.progress-fill {
  height: 100%;
  background: var(--color-primary-dark);
  border-radius: 4px;
}

.pass-classes {
  font-size: 13px;
  color: var(--color-text-body);
}

.pass-classes span {
  font-weight: 600;
  color: var(--color-text-title);
}

/* ── 출석 이력 ── */
.attendance-list {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xs);
}

.attendance-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
}

.attendance-info {
  flex: 1;
}

.attendance-date {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-title);
  margin-bottom: 2px;
}

.attendance-class {
  font-size: 13px;
  color: var(--color-text-body);
}

.badge {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  flex-shrink: 0;
}

.badge-present {
  background: #E8F5E9;
  color: var(--color-success);
}

.badge-absent {
  background: #FDECEA;
  color: var(--color-error);
}

/* ── 메뉴 리스트 ── */
.menu-list {
  display: flex;
  flex-direction: column;
}

.menu-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--color-border);
  text-decoration: none;
  color: var(--color-text-title);
  font-size: 15px;
  cursor: pointer;
  transition: color 0.2s;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-item:hover {
  color: var(--color-primary-dark);
}

.menu-item.muted {
  color: var(--color-text-body);
}

.menu-item.danger {
  color: var(--color-error);
}

.menu-item svg {
  width: 18px;
  height: 18px;
  color: var(--color-text-sub);
  flex-shrink: 0;
}

/* ── 하단 탭바 ── */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--color-bg);
  border-top: 1px solid var(--color-border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 0;
  text-decoration: none;
  font-size: 11px;
  color: var(--color-text-sub);
  transition: color 0.2s;
}

.tab-item.active {
  color: var(--color-primary-dark);
}

.tab-item svg {
  width: 22px;
  height: 22px;
}
</style>
</head>
