<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>홈 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --color-primary: #F8C8DC;
  --color-primary-dark: #F0A8C4;
  --color-primary-light: #FCE4EC;
  --color-bg: #FFFFFF;
  --color-bg-section: #F8F8F8;
  --color-text-title: #2D2D2D;
  --color-text-body: #6B6B6B;
  --color-text-sub: #9B9B9B;
  --color-border: #EEEEEE;
  --color-success: #4CAF50;
  --color-warning: #F4A261;
  --color-error: #E76F51;
  --radius-sm: 8px;
  --radius-md: 12px;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg-section);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
}

.mobile-frame {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--color-bg);
  position: relative;
  padding-bottom: 80px;
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--color-bg);
  padding: 16px var(--spacing-lg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--color-border);
}

.header-logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text-title);
}

.header-bell {
  position: relative;
  cursor: pointer;
}

.header-bell svg {
  width: 24px;
  height: 24px;
  color: var(--color-text-title);
}

.bell-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 16px;
  height: 16px;
  background: var(--color-error);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Content ── */
.content {
  padding: var(--spacing-lg);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-lg);
}

.greeting {
  font-size: 20px;
  font-weight: 600;
  color: var(--color-text-title);
}

.date-text {
  font-size: 13px;
  color: var(--color-text-sub);
  margin-top: 4px;
}

/* ── 정기권 카드 ── */
.pass-card {
  background: var(--color-primary-light);
  border-radius: var(--radius-md);
  padding: 20px;
}

.pass-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-md);
}

.pass-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text-title);
}

.pass-expiry {
  font-size: 12px;
  color: var(--color-text-body);
}

.pass-remaining {
  display: flex;
  align-items: baseline;
  gap: 4px;
  margin-bottom: var(--spacing-sm);
}

.pass-remaining-number {
  font-size: 32px;
  font-weight: 700;
  color: var(--color-text-title);
}

.pass-remaining-unit {
  font-size: 15px;
  color: var(--color-text-body);
}

.progress-bar {
  height: 8px;
  background: rgba(255,255,255,0.6);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--color-primary-dark);
  border-radius: 4px;
  transition: width 0.3s;
}

/* ── 다음 예약 ── */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-sm);
}

.section-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--color-text-title);
}

.section-link {
  font-size: 13px;
  color: var(--color-text-sub);
  text-decoration: none;
}

.section-link:hover {
  color: var(--color-primary-dark);
}

.reservation-list {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
}

.reservation-card {
  display: flex;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.reservation-accent {
  width: 4px;
  background: var(--color-primary);
  flex-shrink: 0;
}

.reservation-info {
  padding: 14px 16px;
  flex: 1;
}

.reservation-datetime {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-title);
  margin-bottom: 2px;
}

.reservation-class {
  font-size: 13px;
  color: var(--color-text-body);
}

.reservation-instructor {
  font-size: 12px;
  color: var(--color-text-sub);
  margin-top: 2px;
}

/* ── CTA ── */
.btn-primary {
  background: var(--color-primary);
  color: var(--color-text-title);
  border: none;
  border-radius: var(--radius-sm);
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  font-family: 'Pretendard', sans-serif;
  cursor: pointer;
  transition: background-color 0.2s;
  width: 100%;
  text-align: center;
  text-decoration: none;
  display: block;
}

.btn-primary:hover {
  background: var(--color-primary-dark);
}

/* ── 하단 탭바 ── */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--color-bg);
  border-top: 1px solid var(--color-border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 0;
  text-decoration: none;
  font-size: 11px;
  color: var(--color-text-sub);
  transition: color 0.2s;
}

.tab-item.active {
  color: var(--color-primary-dark);
}

.tab-item svg {
  width: 22px;
  height: 22px;
}
</style>
</head>
<body>
<div class="mobile-frame">
  <!-- Header -->
  <header class="header">
    <div class="header-logo">필라테스 OO점</div>
    <div class="header-bell">

      </svg>

  <!-- Content -->

    <div>

    <!-- 정기권 카드 -->
    <div class="pass-card">

        <span class="pass-remaining-number">8</span>

      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 67%;"></div>
      </div>
    </div>

    <!-- 다음 예약 -->
    <section>
      <div class="section-header">
        <h2 class="section-title">다음 예약</h2>
        <a href="reservation.html" class="section-link">전체 보기</a>
      </div>
      <div class="reservation-list">
        <div class="reservation-card">
          <div class="reservation-accent"></div>
          <div class="reservation-info">
            <div class="reservation-datetime">5/10 (일) 19:00</div>
            <div class="reservation-class">그룹 필라테스</div>
            <div class="reservation-instructor">박지영 강사</div>
          </div>
        </div>
        <div class="reservation-card">
          <div class="reservation-accent"></div>
          <div class="reservation-info">
            <div class="reservation-datetime">5/13 (수) 19:00</div>
            <div class="reservation-class">그룹 필라테스</div>
            <div class="reservation-instructor">박지영 강사</div>
          </div>
        </div>
        <div class="reservation-card">
          <div class="reservation-accent"></div>
          <div class="reservation-info">
            <div class="reservation-datetime">5/15 (금) 10:00</div>
            <div class="reservation-class">듀엣</div>
            <div class="reservation-instructor">이수진 강사</div>
          </div>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <a href="reservation.html" class="btn-primary">수업 예약하기</a>
  </main>

  <!-- 하단 탭바 -->
  <nav class="tab-bar">
    <a href="home.html" class="tab-item active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955a1.126 1.126 0 0 1 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
      </svg>
      <span>홈</span>
    </a>
    <a href="reservation.html" class="tab-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
      </svg>
      <span>예약</span>
    </a>
    <a href="#" class="tab-item">

      </svg>
      <span>정기권</span>

    <a href="mypage.html" class="tab-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>

</div>
</body>
</html>
