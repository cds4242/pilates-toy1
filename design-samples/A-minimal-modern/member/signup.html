<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>회원가입 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --color-primary: #F0A0B5;
  --color-primary-dark: #D88A9E;
  --color-primary-light: #FAD4DE;
  --color-bg: #FFFFFF;
  --color-bg-section: #F8F8F8;
  --color-text-title: #2D2D2D;
  --color-text-body: #6B6B6B;
  --color-text-sub: #9B9B9B;
  --color-border: #EEEEEE;
  --color-input-border: #DDDDDD;
  --color-success: #4CAF50;
  --color-warning: #F4A261;
  --color-error: #E76F51;
  --radius-sm: 8px;
  --radius-md: 18px;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg-section);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
}

.mobile-frame {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--color-bg);
}

/* -- Header -- */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--color-bg);
  padding: 16px var(--spacing-lg);
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  border-bottom: 1px solid var(--color-border);
}

.header-back {
  cursor: pointer;
  color: var(--color-text-title);
  display: flex;
  align-items: center;
  background: none;
  border: none;
  padding: 0;
}

.header-back svg {
  width: 24px;
  height: 24px;
}

.header-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--color-text-title);
}

/* -- Content -- */
.content {
  padding: var(--spacing-lg);
}

/* -- 프로필 사진 업로드 -- */
.photo-upload {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-xl);
}

.photo-circle {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: var(--color-primary-light);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
}

.photo-circle:hover {
  background: var(--color-primary);
}

.photo-circle svg {
  width: 36px;
  height: 36px;
  color: var(--color-primary-dark);
}

.photo-circle:hover svg {
  color: #fff;
}

.photo-label {
  font-size: 13px;
  color: var(--color-text-sub);
}

/* -- 폼 -- */
.signup-form {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md);
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.input-group label {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-title);
}

.input-group input {
  border: 1px solid var(--color-input-border);
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 15px;
  font-family: 'Pretendard', sans-serif;
  color: var(--color-text-title);
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}

.input-group input::placeholder {
  color: var(--color-text-sub);
}

.input-group input:focus {
  border-color: var(--color-primary);
}

/* -- 성별 선택 -- */
.radio-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.radio-group-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-title);
}

.radio-options {
  display: flex;
  gap: var(--spacing-sm);
}

.radio-option {
  flex: 1;
  position: relative;
}

.radio-option input[type="radio"] {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.radio-option label {
  display: block;
  text-align: center;
  padding: 12px;
  border: 1px solid var(--color-input-border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 500;
  color: var(--color-text-body);
  cursor: pointer;
  transition: all 0.2s;
}

.radio-option input[type="radio"]:checked + label {
  border-color: var(--color-primary);
  background: var(--color-primary-light);
  color: var(--color-text-title);
  font-weight: 600;
}

/* -- 버튼 -- */
.btn-primary {
  background: var(--color-primary);
  color: var(--color-text-title);
  border: none;
  border-radius: var(--radius-sm);
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  font-family: 'Pretendard', sans-serif;
  cursor: pointer;
  transition: background-color 0.2s;
  width: 100%;
  margin-top: var(--spacing-md);
}

.btn-primary:hover {
  background: var(--color-primary-dark);
}

.btn-primary:active {
  transform: scale(0.99);
}

/* -- 로그인 링크 -- */
.login-link {
  text-align: center;
  margin-top: var(--spacing-lg);
  padding-bottom: var(--spacing-xl);
  font-size: 15px;
  color: var(--color-text-body);
}

.login-link a {
  color: var(--color-primary-dark);
  text-decoration: none;
  font-weight: 600;
}

.login-link a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>
<div class="mobile-frame">
  <!-- Header -->
  <header class="header">
    <button class="header-back" onclick="history.back()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
      </svg>
    </button>
    <h1 class="header-title">회원가입</h1>
  </header>

  <!-- Content -->
  <main class="content">
    <!-- 프로필 사진 업로드 -->
    <div class="photo-upload">
      <div class="photo-circle" onclick="alert('프로필 사진 업로드')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z"/>
        </svg>
      </div>
      <span class="photo-label">프로필 사진 등록 (선택)</span>
    </div>

    <!-- 가입 폼 -->
    <form class="signup-form" onsubmit="event.preventDefault(); alert('가입 완료!'); location.href='login.html';">
      <div class="input-group">
        <label for="name">이름</label>
        <input type="text" id="name" placeholder="이름을 입력하세요" required>
      </div>

      <div class="input-group">
        <label for="phone">휴대폰 번호</label>
        <input type="tel" id="phone" placeholder="010-0000-0000" autocomplete="tel" required>
      </div>

      <div class="input-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="new-password" required>
      </div>

      <div class="input-group">
        <label for="password-confirm">비밀번호 확인</label>
        <input type="password" id="password-confirm" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" required>
      </div>

      <div class="radio-group">
        <span class="radio-group-label">성별</span>
        <div class="radio-options">
          <div class="radio-option">
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">남성</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="female" name="gender" value="female" checked>
            <label for="female">여성</label>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label for="birth">생년월일</label>
        <input type="date" id="birth" required>
      </div>

      <button type="submit" class="btn-primary">가입하기</button>
    </form>

    <div class="login-link">
      이미 계정이 있으신가요? <a href="login.html">로그인</a>
    </div>
  </main>
</div>
</body>
</html>
