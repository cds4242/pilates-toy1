<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>홈 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --color-mint: #A8E6CF;
  --color-mint-dark: #7DD3B0;
  --color-pink: #FF6B9D;
  --color-pink-dark: #E8558A;
  --color-bg: #FFFFFF;
  --color-bg-section: #F0F0F0;
  --color-text-title: #2C3E50;
  --color-text-body: #5A6B7A;
  --color-text-sub: #95A5B5;
  --color-border: #E8ECF0;
  --color-success: #4CAF50;
  --color-error: #E74C3C;
  --radius-sm: 12px;
  --radius-md: 12px;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg-section);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
}

.mobile-frame {
  max-width: 480px; margin: 0 auto;
  min-height: 100vh; background: var(--color-bg);
  position: relative; padding-bottom: 80px;
}

.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--color-bg);
  padding: 16px var(--spacing-lg);
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 2px solid var(--color-border);
}

.header-logo {
  font-size: 18px; font-weight: 900;
  color: var(--color-text-title);
  letter-spacing: -0.5px;
}

.header-bell { position: relative; cursor: pointer; }
.header-bell svg { width: 24px; height: 24px; color: var(--color-text-title); }
.bell-badge {
  position: absolute; top: -4px; right: -4px;
  width: 16px; height: 16px;
  background: var(--color-pink); color: #fff;
  font-size: 10px; font-weight: 800;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}

.content {
  padding: var(--spacing-lg);
  display: flex; flex-direction: column; gap: var(--spacing-lg);
}

.greeting {
  font-size: 22px; font-weight: 900;
  color: var(--color-text-title);
  letter-spacing: -0.5px;
}

.date-text { font-size: 13px; font-weight: 600; color: var(--color-text-sub); margin-top: 4px; }

/* ── 정기권 카드 ── */
.pass-card {
  background: linear-gradient(135deg, var(--color-mint), var(--color-pink));
  border-radius: var(--radius-md);
  padding: 24px;
  color: #FFFFFF;
  position: relative;
  overflow: hidden;
}

.pass-card::after {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
}

.pass-name {
  font-size: 14px; font-weight: 700;
  opacity: 0.9;
  margin-bottom: var(--spacing-xs);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.pass-remaining {
  display: flex; align-items: baseline; gap: 4px;
  margin-bottom: var(--spacing-sm);
}

.pass-remaining-number { font-size: 42px; font-weight: 900; }
.pass-remaining-unit { font-size: 16px; font-weight: 700; opacity: 0.9; }

.progress-bar {
  height: 8px; background: rgba(255,255,255,0.3);
  border-radius: 4px; overflow: hidden;
  margin-bottom: var(--spacing-sm);
}

.progress-fill { height: 100%; background: #FFFFFF; border-radius: 4px; }

.pass-expiry { font-size: 13px; font-weight: 600; opacity: 0.85; }

/* ── 다음 예약 ── */
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: var(--spacing-sm);
}

.section-title { font-size: 18px; font-weight: 800; color: var(--color-text-title); }

.section-link {
  font-size: 13px; font-weight: 700;
  color: var(--color-pink);
  text-decoration: none;
}

.reservation-list {
  display: flex; flex-direction: column; gap: var(--spacing-sm);
}

.reservation-card {
  display: flex; background: var(--color-bg);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: border-color 0.2s;
}

.reservation-card:hover { border-color: var(--color-mint); }

.reservation-accent {
  width: 5px;
  background: linear-gradient(180deg, var(--color-mint), var(--color-pink));
  flex-shrink: 0;
}

.reservation-info { padding: 14px 16px; flex: 1; }

.reservation-datetime {
  font-size: 15px; font-weight: 800;
  color: var(--color-text-title);
  margin-bottom: 2px;
}

.reservation-class { font-size: 13px; font-weight: 600; color: var(--color-text-body); }
.reservation-instructor { font-size: 12px; font-weight: 600; color: var(--color-text-sub); margin-top: 2px; }

/* ── CTA ── */
.btn-primary {
  background: linear-gradient(135deg, var(--color-mint), var(--color-pink));
  color: #FFFFFF; border: none;
  border-radius: var(--radius-sm);
  padding: 16px; font-size: 16px; font-weight: 800;
  font-family: 'Pretendard', sans-serif;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  width: 100%;
  text-align: center; text-decoration: none;
  display: block;
}

.btn-primary:hover { opacity: 0.9; }
.btn-primary:active { transform: scale(0.98); }

/* ── 탭바 ── */
.tab-bar {
  position: fixed; bottom: 0;
  left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--color-bg);
  border-top: 2px solid var(--color-border);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 10px 0;
  text-decoration: none;
  font-size: 11px; font-weight: 700;
  color: var(--color-text-sub);
  transition: color 0.2s;
}

.tab-item.active { color: var(--color-pink); }
.tab-item svg { width: 22px; height: 22px; }
</style>
</head>
<body>

    <div class="header-bell">

  </main>

  <nav class="tab-bar">

    <a href="reservation.html" class="tab-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg><span>예약</span></a>
