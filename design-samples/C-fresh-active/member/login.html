<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>로그인 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --color-mint: #A8E6CF;
  --color-mint-dark: #7DD3B0;
  --color-pink: #FF6B9D;
  --color-pink-dark: #E8558A;
  --color-bg: #FFFFFF;
  --color-bg-section: #F0F0F0;
  --color-text-title: #2C3E50;
  --color-text-body: #5A6B7A;
  --color-text-sub: #95A5B5;
  --color-border: #E8ECF0;
  --color-input-border: #D5DBE1;
  --color-success: #4CAF50;
  --color-error: #E74C3C;
  --radius-sm: 12px;
  --radius-md: 12px;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-xxl: 48px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
}

.mobile-frame {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--color-bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--spacing-lg);
}

.login-header {
  text-align: center;
  margin-bottom: var(--spacing-xxl);
  padding-top: var(--spacing-xl);
}

.logo-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--color-mint), var(--color-pink));
  margin: 0 auto var(--spacing-md);
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-icon svg {
  width: 28px;
  height: 28px;
  color: #FFFFFF;
}

.logo-text {
  font-size: 26px;
  font-weight: 900;
  color: var(--color-text-title);
  letter-spacing: -1px;
  margin-bottom: 4px;
}

.logo-sub {
  font-size: 14px;
  font-weight: 700;
  color: var(--color-pink);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md);
  margin-bottom: var(--spacing-lg);
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.input-group label {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text-title);
}

.input-group input {
  border: 2px solid var(--color-input-border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-size: 15px;
  font-family: 'Pretendard', sans-serif;
  font-weight: 600;
  color: var(--color-text-title);
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}

.input-group input::placeholder {
  color: var(--color-text-sub);
  font-weight: 400;
}

.input-group input:focus {
  border-color: var(--color-mint);
}

.btn-primary {
  background: linear-gradient(135deg, var(--color-mint), var(--color-pink));
  color: #FFFFFF;
  border: none;
  border-radius: var(--radius-sm);
  padding: 16px;
  font-size: 16px;
  font-weight: 800;
  font-family: 'Pretendard', sans-serif;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  width: 100%;
  letter-spacing: 0.5px;
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-primary:active {
  transform: scale(0.98);
}

.login-links {
  display: flex;
  justify-content: center;
  gap: var(--spacing-xl);
  margin-top: var(--spacing-lg);
}

.login-links a {
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  color: var(--color-text-sub);
  transition: color 0.2s;
}

.login-links a:first-child {
  color: var(--color-pink);
}

.login-links a:hover {
  color: var(--color-text-title);
}
</style>
</head>
<body>
<div class="mobile-frame">
  <div class="login-header">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
    </div>
    <div class="logo-text">필라테스 OO점</div>
    <div class="logo-sub">Login</div>
  </div>

  <form class="login-form" onsubmit="event.preventDefault(); location.href='home.html';">
    <div class="input-group">
      <label for="phone">휴대폰 번호</label>
      <input type="tel" id="phone" placeholder="010-0000-0000" autocomplete="tel">
    </div>
    <div class="input-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-primary">로그인</button>
  </form>

  <div class="login-links">
    <a href="#">회원가입</a>
    <a href="#">비밀번호 찾기</a>
  </div>
</div>
</body>
</html>
