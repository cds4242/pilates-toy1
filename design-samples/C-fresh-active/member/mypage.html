<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>마이페이지 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --color-mint: #A8E6CF;
  --color-mint-dark: #7DD3B0;
  --color-pink: #FF6B9D;
  --color-pink-dark: #E8558A;
  --color-bg: #FFFFFF;
  --color-bg-section: #F0F0F0;
  --color-text-title: #2C3E50;
  --color-text-body: #5A6B7A;
  --color-text-sub: #95A5B5;
  --color-border: #E8ECF0;
  --color-success: #4CAF50;
  --color-error: #E74C3C;
  --radius-sm: 12px;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg-section);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
}

.mobile-frame { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--color-bg); padding-bottom: 80px; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--color-bg);
  padding: 16px var(--spacing-lg);
  border-bottom: 2px solid var(--color-border);
}

.header-title { font-size: 18px; font-weight: 900; color: var(--color-text-title); }

.content { padding: var(--spacing-lg); display: flex; flex-direction: column; gap: var(--spacing-lg); }

/* ── 프로필 ── */
.profile-card {
  display: flex; align-items: center; gap: var(--spacing-md);
  padding: 20px;
  border: 2px solid var(--color-border);
  border-radius: var(--radius-sm);
}

.profile-avatar {
  width: 60px; height: 60px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--color-mint), var(--color-pink));
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 900;
  color: #FFFFFF;
  flex-shrink: 0;
}

.profile-info { flex: 1; }
.profile-name { font-size: 20px; font-weight: 900; color: var(--color-text-title); margin-bottom: 2px; }
.profile-joined { font-size: 13px; font-weight: 600; color: var(--color-text-sub); }
.profile-attendance { font-size: 14px; font-weight: 800; color: var(--color-success); margin-top: 4px; }

/* ── 정기권 ── */
.section-title { font-size: 18px; font-weight: 800; color: var(--color-text-title); margin-bottom: var(--spacing-sm); }

.pass-card {
  background: linear-gradient(135deg, var(--color-mint), var(--color-pink));
  border-radius: var(--radius-sm);
  padding: 20px;
  color: #FFFFFF;
  position: relative;
  overflow: hidden;
}

.pass-card::after {
  content: '';
  position: absolute; top: -20px; right: -20px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
}

.pass-name { font-size: 14px; font-weight: 700; opacity: 0.9; letter-spacing: 1px; text-transform: uppercase; margin-bottom: var(--spacing-xs); }

.pass-count { display: flex; align-items: baseline; gap: 4px; margin-bottom: var(--spacing-sm); }
.pass-count-current { font-size: 32px; font-weight: 900; }
.pass-count-total { font-size: 14px; font-weight: 700; opacity: 0.85; }

.progress-bar { height: 8px; background: rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; margin-bottom: var(--spacing-sm); }
.progress-fill { height: 100%; background: #FFFFFF; border-radius: 4px; }

.pass-meta { font-size: 13px; font-weight: 600; opacity: 0.85; }
.pass-expiry { font-size: 13px; font-weight: 600; opacity: 0.85; margin-top: 4px; }

/* ── 출석 이력 ── */
.attendance-list { display: flex; flex-direction: column; gap: var(--spacing-xs); }

.attendance-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px;
  border: 2px solid var(--color-border);
  border-radius: var(--radius-sm);
}

.attendance-info { flex: 1; }
.attendance-date { font-size: 14px; font-weight: 800; color: var(--color-text-title); margin-bottom: 2px; }
.attendance-class { font-size: 13px; font-weight: 600; color: var(--color-text-body); }

.badge { font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: var(--radius-sm); }
.badge-present { background: #E8F5E9; color: var(--color-success); }
.badge-absent { background: #FDECEA; color: var(--color-error); }

/* ── 메뉴 ── */
.menu-list { display: flex; flex-direction: column; }

.menu-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--color-border);
  text-decoration: none;
  color: var(--color-text-title);
  font-size: 15px; font-weight: 700;
  cursor: pointer; transition: color 0.2s;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover { color: var(--color-pink); }
.menu-item.muted { color: var(--color-text-body); }
.menu-item.danger { color: var(--color-error); }
.menu-item svg { width: 18px; height: 18px; color: var(--color-text-sub); }

/* ── 탭바 ── */
.tab-bar {
  position: fixed; bottom: 0;
  left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--color-bg);
  border-top: 2px solid var(--color-border);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 10px 0;
  text-decoration: none; font-size: 11px; font-weight: 700;
  color: var(--color-text-sub); transition: color 0.2s;
}
.tab-item.active { color: var(--color-pink); }
.tab-item svg { width: 22px; height: 22px; }
</style>
</head>
