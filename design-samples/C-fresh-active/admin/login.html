<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>관리자 로그인 - 필라테스 OO점</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --color-mint: #A8E6CF;
  --color-mint-dark: #7DD3B0;
  --color-pink: #FF6B9D;
  --color-pink-dark: #E8558A;
  --color-bg: #FFFFFF;
  --color-bg-section: #F0F0F0;
  --color-text-title: #2C3E50;
  --color-text-body: #5A6B7A;
  --color-text-sub: #95A5B5;
  --color-border: #E8ECF0;
  --color-input-border: #D5DBE1;
  --radius-sm: 12px;
  --radius-md: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg-section);
  color: var(--color-text-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-container {
  display: flex;
  max-width: 900px;
  width: 100%;
  min-height: 500px;
  background: var(--color-bg);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
}

.login-hero {
  flex: 1;
  background: linear-gradient(135deg, var(--color-mint), var(--color-pink));
  padding: 60px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  color: #FFFFFF;
  position: relative;
  overflow: hidden;
}

.login-hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
  border-radius: 50%;
}

.login-hero h1 {
  font-size: 32px;
  font-weight: 900;
  margin-bottom: var(--spacing-md);
  letter-spacing: -1px;
  line-height: 1.3;
  position: relative;
}

.login-hero p {
  font-size: 15px;
  font-weight: 600;
  opacity: 0.95;
  line-height: 1.7;
  position: relative;
}

.login-form-side {
  flex: 1;
  padding: 60px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.form-badge {
  display: inline-block;
  background: linear-gradient(135deg, var(--color-mint), var(--color-pink));
  color: #FFFFFF;
  font-size: 12px;
  font-weight: 800;
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: var(--spacing-lg);
  width: fit-content;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.form-title {
  font-size: 24px;
  font-weight: 900;
  color: var(--color-text-title);
  margin-bottom: var(--spacing-xl);
  letter-spacing: -0.5px;
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md);
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.input-group label {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text-title);
}

.input-group input {
  border: 2px solid var(--color-input-border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-size: 15px;
  font-family: 'Pretendard', sans-serif;
  font-weight: 600;
  color: var(--color-text-title);
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}

.input-group input::placeholder {
  color: var(--color-text-sub);
  font-weight: 400;
}

.input-group input:focus {
  border-color: var(--color-mint);
}

.btn-admin {
  background: linear-gradient(135deg, var(--color-mint), var(--color-pink));
  color: #FFFFFF;
  border: none;
  border-radius: var(--radius-sm);
  padding: 16px;
  font-size: 16px;
  font-weight: 800;
  font-family: 'Pretendard', sans-serif;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  width: 100%;
  margin-top: var(--spacing-md);
  letter-spacing: 0.5px;
}

.btn-admin:hover { opacity: 0.9; }
.btn-admin:active { transform: scale(0.98); }

@media (max-width: 768px) {
  .login-container {
    flex-direction: column;
    max-width: 480px;
    margin: var(--spacing-lg);
  }
  .login-hero {
    padding: 40px var(--spacing-lg);
    min-height: auto;
  }
  .login-hero h1 { font-size: 24px; }
  .login-form-side { padding: var(--spacing-lg); }
}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-hero">
    <h1>필라테스 OO점<br>관리 시스템</h1>
    <p>회원, 강사, 시간표, 매출을<br>한곳에서 효율적으로 관리하세요.</p>
  </div>
  <div class="login-form-side">
    <span class="form-badge">Admin</span>
    <h2 class="form-title">로그인</h2>
    <form class="login-form" onsubmit="event.preventDefault();location.href='dashboard.html';">
      <div class="input-group"><label for="email">이메일</label><input type="email" id="email" placeholder="admin@pilates.com" autocomplete="email"></div>
      <div class="input-group"><label for="password">비밀번호</label><input type="password" id="password" placeholder="비밀번호" autocomplete="current-password"></div>
      <div class="input-group"><label for="otp">2FA 인증 코드</label><input type="text" id="otp" placeholder="6자리 코드 입력" maxlength="6" inputmode="numeric"></div>
      <button type="submit" class="btn-admin">로그인</button>
    </form>
  </div>
</div>
</body>
</html>
