# ── 테스트 환경 설정 ──
# H2 인메모리 DB 사용, Docker 의존 없이 테스트 실행

spring:
  datasource:
    url: jdbc:h2:mem:pilates-test;DB_CLOSE_DELAY=-1;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  # Flyway 비활성화 (테스트는 JPA ddl-auto=create-drop)
  flyway:
    enabled: false

  # Redis (테스트용 - Docker Redis 필요)
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: WARN
    com.pilates: DEBUG

app:
  logging:
    masking:
      enabled: false
  encryption:
    key: dGVzdC1rZXktMzItYnl0ZXMtbG9uZy1leGFtcGxlISE=
    key-version: v1
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyEhISE=
    access-token-expiration: 1800
    refresh-token-expiration: 1209600
