spring:
  application:
    name: pilates-studio

  # profiles.active는 여기서 지정하지 않는다.
  # 반드시 실행 시 --spring.profiles.active=<profile> 로 명시할 것.
  # 프로파일 누락 시 datasource 설정이 없어 컨텍스트 로딩이 실패한다.

  # ── JPA 공통 설정 ──
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  # ── Flyway (DB 마이그레이션) ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson 직렬화 ──
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# ── 서버 설정 ──
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  shutdown: graceful

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# ── 앱 정보 ──
info:
  app:
    name: Pilates Studio API
    version: 0.0.1-SNAPSHOT
    description: 필라테스 스튜디오 예약 관리 시스템

# ── 앱 커스텀 설정 ──
app:
  version: 0.0.1-SNAPSHOT
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-must-be-at-least-32-characters-long}
    access-token-expiry: 1800000    # 30분 (ms)
    refresh-token-expiry: 1209600000 # 14일 (ms)
  logging:
    masking:
      enabled: true
