# ── 운영 환경 설정 ──
# 모든 시크릿은 환경변수로 주입, 하드코딩 금지

spring:
  # ── MySQL (운영) ──
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 5000

  # ── JPA (운영: DDL 자동 변경 금지) ──
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # ── Redis (운영) ──
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ── Swagger UI 비활성화 (운영 환경에서는 API 문서 노출 금지) ──
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── 로깅 (운영: JSON 포맷, 마스킹 활성화) ──
logging:
  level:
    root: INFO
    com.pilates: INFO

# ── JWT (운영: 반드시 환경변수 설정 필요) ──
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  logging:
    masking:
      enabled: true
