# ── 로컬 개발 환경 설정 ──
# Docker Compose로 MySQL, Redis 실행 후 사용

spring:
  # ── MySQL (로컬 Docker) ──
  datasource:
    url: jdbc:mysql://localhost:3306/pilates?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: pilates
    password: pilates1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000

  # ── JPA (로컬) ──
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  # ── Flyway (migration + 개발 시드) ──
  flyway:
    locations: classpath:db/migration, classpath:db/seed/dev

  # ── Redis (로컬 Docker) ──
  # 6379는 Windows 동적 포트 예약 범위(6312-6711)와 충돌해 6800 사용
  data:
    redis:
      host: localhost
      port: 6800

  # ── H2 콘솔 비활성화 (MySQL 사용) ──
  h2:
    console:
      enabled: false

# ── 로깅 (로컬: 콘솔 출력, 마스킹 해제) ──
logging:
  level:
    root: INFO
    com.pilates: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  logging:
    masking:
      enabled: false
  encryption:
    key: ${ENCRYPTION_KEY:dGVzdC1rZXktMzItYnl0ZXMtbG9uZy1leGFtcGxlISE=}
    key-version: v1
  jwt:
    secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyEhISE=}
    access-token-expiration: 1800
    refresh-token-expiration: 1209600
  toss:
    secret-key: test_sk_DUMMY
